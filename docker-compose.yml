# Default: `docker compose up --build` runs ai-service only, against an external
# whisper-api set by WHISPER_API_URL (+ WHISPER_API_KEY) in .env.
# Local whisper-api: `docker compose --profile local-whisper up --build` also
# builds and runs whisper-api here; leave WHISPER_API_URL unset so ai-service
# uses the default http://whisper-api:8000/v1.
services:
  whisper-api:
    profiles: [local-whisper]
    build:
      context: .
      dockerfile: docker/whisper-api.Dockerfile
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      DEVICE: ${DEVICE:-cuda}
      COMPUTE_TYPE: ${COMPUTE_TYPE:-}
      VAD_FILTER: ${VAD_FILTER:-true}
      CONDITION_ON_PREVIOUS_TEXT: ${CONDITION_ON_PREVIOUS_TEXT:-true}
      # Open JSON object of faster-whisper transcribe options, merged over the
      # tuned defaults (e.g. '{"beam_size":5,"temperature":0}'). Empty = defaults.
      TRANSCRIBE_OPTIONS: ${TRANSCRIBE_OPTIONS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # the same key ai-service sends as its Bearer token
      API_KEY: ${WHISPER_API_KEY:-}
      # Optional TLS — set both to serve HTTPS (see the commented certs mount below).
      SSL_CERTFILE: ${SSL_CERTFILE:-}
      SSL_KEYFILE: ${SSL_KEYFILE:-}
      SSL_KEYFILE_PASSWORD: ${SSL_KEYFILE_PASSWORD:-}
      # CN of the self-signed cert the entrypoint generates when SSL_CERTFILE/
      # SSL_KEYFILE are set but no cert is mounted at those paths.
      DOMAIN: ${DOMAIN:-}
    volumes:
      - model-cache:/cache/huggingface
      # Enable HTTPS: mount your certs and set SSL_CERTFILE/SSL_KEYFILE to the
      # in-container paths (then use https:// in WHISPER_API_URL).
      # Skip the mount to let the entrypoint generate a self-signed pair instead.
      # - ./certs:/certs:ro
    # Publish only to reach whisper-api from outside compose (ai-service doesn't need it).
    # ports:
    #   - "8000:8000"
    healthcheck:
      # If you force HTTPS, switch this probe to https:// and add ssl._create_unverified_context.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s   # first start downloads the model
    # Enable for DEVICE=cuda; leave commented on CPU-only hosts.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: docker/ai-service.Dockerfile
    env_file: .env
    environment:
      WHISPER_API_URL: ${WHISPER_API_URL:-http://whisper-api:8000/v1}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-}
    ports:
      - "${AI_SERVICE_PORT:-8080}:8080"
    volumes:
      - ai-service-data:/data
      # routing table, read when EMAIL_ROUTING_FILE=/app/config/email-routing.toml;
      # mounted so edits apply on `docker compose up -d --force-recreate ai-service`
      - ./config:/app/config:ro
    depends_on:
      whisper-api:
        condition: service_healthy
        # ignored when the local-whisper profile is off (needs Compose >= 2.20)
        required: false
    restart: unless-stopped

volumes:
  model-cache:
  ai-service-data:
