# Email routing for ai-service (EMAIL_ROUTING_FILE). Order of checks:
#   1. [[file_route]]  — the recording's file name (glob, case-sensitive)
#   2. [[route]]       — the client recognized in the summary: e-mail domain
#                        (subdomains match, most specific wins), then company name
#                        (case/quotes/ООО/«Х5»≈«X5»-insensitive, whole words,
#                        longest name wins)
#   3. default         — nobody recognized, or not listed here
# A domain or company in two routes is rejected at startup.

default = "time017@aeroclub.team"

[[file_route]]
pattern = "AWAD_IVRrecord_*"
to = "anywayanyday-info-gate@yandex.ru"

[[file_route]]
pattern = "GATE_IVRrecord_*"
to = "info@go.gate.ru"

