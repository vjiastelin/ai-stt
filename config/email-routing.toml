# Email routing for ai-service (EMAIL_ROUTING_FILE). Order of checks:
#   1. [[file_route]]   — the recording's file name (glob, case-sensitive)
#   2. [[route]]        — the client recognized in the summary: e-mail domain
#                         (subdomains match, most specific wins), then company name
#                         (case/quotes/ООО/«Х5»≈«X5»-insensitive, whole words,
#                         longest name wins)
#   3. default          — nobody recognized, or not listed here
#
# [[route.client]] = one client company: name + aliases + its domains. Aliases cover
# how callers actually say the name (Russian/Latin spelling, brands, former names,
# subsidiaries). Clients with domains also become the summary prompt's list of known
# corporate domains ({KNOWN_EMAIL_DOMAINS}); the first domain is the main one.
# A domain or company listed for two clients is rejected at startup.
#
# Owners of the domains were checked on the web (sites, whois, MX/NS records) in
# Oct 2026; «medium» notes mark matches based on shared mail servers only.

default = "time017@aeroclub.team"

[[file_route]]
name = "Anywayanyday"
pattern = "AWAD_IVRrecord_*"
to = "anywayanyday-info-gate@yandex.ru"

[[file_route]]
name = "Gate"
pattern = "GATE_IVRrecord_*"
to = "info@go.gate.ru"

