# Email routing for ai-service (EMAIL_ROUTING_FILE). Order of checks:
#   1. [[file_route]]   — the recording's file name (glob, case-sensitive)
#   2. [[route]]        — the client recognized in the summary: e-mail domain
#                         (subdomains match, most specific wins), then company name
#                         (case/quotes/ООО/«Х5»≈«X5»-insensitive, whole words,
#                         longest name wins)
#   3. default          — nobody recognized, or not listed here
#
# [[route.client]] = one client company: name + aliases + its domains. Clients with
# domains also become the summary prompt's list of known corporate domains
# ({KNOWN_EMAIL_DOMAINS}), so the LLM can complete an address whose domain was lost.
# Bare `domains` / `companies` on a route still route mail but are NOT shown to the
# LLM (no company↔domain pair) — move them into a client once the owner is known.
# A domain or company listed twice is rejected at startup.

default = "time017@aeroclub.team"

[[file_route]]
pattern = "AWAD_IVRrecord_*"
to = "anywayanyday-info-gate@yandex.ru"

[[file_route]]
pattern = "GATE_IVRrecord_*"
to = "info@go.gate.ru"

